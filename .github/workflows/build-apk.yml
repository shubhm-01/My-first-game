name: Build Android Test APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master
      - patna-2047-realistic-world
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          echo "Verifying generated APKs..."
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk/debug/ -name "*.apk" | grep -q . || (echo "Error: No APK found!" && exit 1)

      - name: Upload Milestone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-LAST-ALCHEMIST-PHASE-05-STORY-MEMORY-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

